# The "I" of PCDIT, and the first phase whose gate is not a judge.
#
# The compiler decides whether this phase passes: every test case must pass. The model
# never gets a vote on that, and it is only called at all once the code already works --
# so its whole job is the question a compiler cannot answer, which is whether the code
# the student wrote is the design the student planned.
#
# Notes live in this leading block because only the leading block survives a save from
# CLive Studio (`read_header` in prompts.py).
#
#   gate       `tests`. See docs/superpowers/specs/2026-09-07-implement-phase-design.md.
#              student.submit grades before it judges, and does not judge at all when a
#              case fails -- there is no point spending a call reviewing broken code, and
#              it means the review below always reads a working program.
#
#   criteria   All advisory, and `tests/test_implement_content.py` enforces it. A gating
#              criterion here would let the judge bar code that passes every test.
#
#   evidence   Inverted from the other three phases in one respect. There, EARLIER PHASES
#              is context that must never be quoted. Here the earlier phases are the
#              standard being applied -- the criteria are *about* conformance to them --
#              so the design may be described and referred to. Evidence is still a span
#              of the student's code, because that is the artifact being judged.

id: phase.implement
version: 10
phase: implement
label: Implement
order: 4
gate: tests
created: 2026-09-07
changelog: >
  criteria v5 (2026-10-25): function problems -- parameters are inputs, the return value is the output.

  v10: Prompts and intros reworded to teach the habit each phase stands for, in the spirit of PCDIT (understand the problem, solve examples by hand, plan in words, code from the plan), at the author's request (2026-10-10). The fill-in instructions are unchanged; the judge's template renders none of these keys. Wording is a draft for the author to revise.

  v9: Wording revised by the team in docs/UI Text.md (2026-10-05) and imported; Google Docs artifacts (en dashes, escaped characters, renumbered sub-steps) were not carried over. The team's edit dropped the no-AI sentence; Justin kept it.

  v8: Intro trimmed to four short lines in CCPROG1 terms and the C reference link (and its
  box) removed, after Justin observed in a CCPROG1 class that students may not understand
  many of the concepts and terms the page used ("standard input/output", "warnings treated
  as errors", "the build"). The no-AI rule stays in the intro. The field hint drops
  "standard input/output". Wording is a draft for the author to revise.

  v7: A program that does not compile now gets markers in the editor -- the spot gcc
  stopped at and a short description of the kind of problem, from
  prompts/base/diagnostics.yaml -- and no code nudge. This narrows v4's "CLive does not
  teach C syntax" rather than reversing it: CLive shows where the compiler is stuck and
  never names the fix. Prompted by the 2026-10-02 proposed changes, which asked whether
  syntax correcting could introduce logic errors. No change to anything the judge sees.

  v6: task_description no longer says the code "is read once more against the plan".
  A Session 4 participant read that as meaning the earlier phases were closed, and
  rewrote a finished algorithm in his head rather than going back to Design (Sessions
  3-4, T3). Passed phases stay open and editable; the sentence now says so. No change
  to anything the judge sees.

  v5: Judge model `deepseek-chat` -> `deepseek-flash`, and `max_output_tokens`
  4000 -> 32000. DeepSeek calls now always run with thinking on so the reasoning
  can be logged; `deepseek-chat` was the same model with thinking off, which is
  why 4000 was ample. Reasoning is paid for out of the same cap. Measured on
  synthetic pilot artifacts, a judge call used 272-19,015 reasoning tokens
  (median about 3,000; the same artifact ranged 1,198-19,015), so 4000 would have
  truncated 8 of 18 calls and 8000 would have truncated 3. A cap only bounds the
  worst case: typical calls use far less. Verdicts recorded before this change
  came from non-thinking flash and are not directly comparable.

  v4: Round 1 testing found syntax, not the algorithm, was where both participants
  lost most of the session, and the hint -- built for plan conformance -- answered a
  different question when asked about printf. Decided scope: CLive does not teach C
  syntax. `task_description` now says so and states the reference rule (web search
  for documentation allowed, AI assistants not), and a new `references` entry links the
  cppreference C front page beside the editor -- one general reference rather than
  per-function pages, which would fit the two participants' specific stumbles rather
  than C syntax in general. The CS50 manual was considered and left out: it is built
  around cs50.h, which this compiler does not provide. The rule is stated in the task so
  every participant gets the same one, rather than having it improvised per session.

  v3: STUDENT ARTIFACT now renders a blank field as truly empty instead of the
  literal string "(not provided)", which the judge could otherwise quote back as
  `evidence`. Low-impact here -- the only field is `code`, and Submit only reaches
  the judge once the compiler gate has already passed a non-empty program -- but
  kept consistent with every other phase. See phase.problem_definition v5 for the
  full rationale.

  v2: Judge model moved from `deepseek-v4-pro` to `deepseek-chat` (flash) to cut
  cost, matching every other phase. `max_output_tokens` lowered 8000 -> 4000. The
  criteria here are all advisory and the compiler has already settled correctness,
  so a weaker judge only softens the design-conformance notes; nothing it says can
  gate the student.

  v1: Initial definition. The fourth PCDIT step, gated by the test cases and advised by
  a judge that reads the code against the student's own Problem, Cases and Design. Only
  runs once every test passes, so it never comments on correctness -- the compiler has
  already settled that.

model:
  id: deepseek-flash
  effort: medium
  thinking: adaptive
  max_output_tokens: 32000
  response_format: json_schema
  schema: base/output_schema.json

task_description: |
  Now translate your plan into C, one step at a time. Your design is beside your code. Press
  Run to test it on the examples. Press Submit when
  it works for a final check against test cases you haven't seen. Print only what the
  problem asks for, with no extra messages like "Enter a number:". Don't use AI tools like
  ChatGPT.

artifact_fields:
  - id: code
    label: Your C program
    kind: code
    language: c
    hint: Write your whole program here.
    rows: 20

system_prompt: |
  You are reviewing one student's C program at the last step of a structured problem-solving process. You are not holding a conversation, and you are not teaching C.

  The program has already passed every test case. Its correctness is settled and is not yours to re-litigate. You are judging one thing: whether the program the student wrote is the plan the student designed.

  The student wrote, in earlier phases, a definition of the problem, a set of test cases worked by hand, and an ordered plan in plain language. Those are supplied under EARLIER PHASES. They are the standard you apply.

  You judge the artifact against a fixed list of criteria. For each criterion you return exactly one verdict.

  Rules:
  - Return exactly one verdict per criterion id listed under CRITERIA TO JUDGE. Never merge, skip, split, or invent a criterion id.
  - Judge each criterion only against its own stated text and guidance. A strong program can still fail one criterion; do not let a verdict on one pull the others with it.
  - Never fail a criterion because you would have solved the problem differently. The plan is the student's, and a program that faithfully implements a clumsy plan satisfies these criteria. Elegance is not being judged, and neither is efficiency.
  - Do not report bugs. Every test passed. If you believe you have found a case that fails, you have misread the code — say nothing about it and judge the criterion in front of you.
  - Quote evidence verbatim from the STUDENT ARTIFACT — copy the exact span of code, do not paraphrase, correct, or reformat it. If nothing in the program bears on the criterion, return an empty evidence string and FAIL.
  - EARLIER PHASES is the standard, not the evidence. You may refer to what the plan said, in your own words, when explaining a verdict. The evidence string itself must always be a span of the student's code.
  - The problem statement and public test cases are context. Never quote them as evidence.
  - Set confidence to reflect how clearly the program settles the criterion, not how confident you are in general. Use "low" when the correspondence is arguable.

user_template: |
  PROBLEM STATEMENT
  {{ problem.statement }}

  {% if problem.public_test_cases %}
  PUBLIC TEST CASES
  {% for case in problem.public_test_cases %}
  - input: {{ case.input | tojson }} output: {{ case.output | tojson }}
  {% endfor %}
  {% endif %}
  {% if prior_artifacts %}
  EARLIER PHASES
  This student's own work from earlier phases. This is the standard you are applying: the
  criteria ask whether the program below matches it. Refer to it in your reasoning; never
  use it as the evidence string.
  {% for p in prior_artifacts %}
  {{ p.label }}:
  {% for f in p.fields %}
  - {{ f.label }}: {{ f.value }}
  {% endfor %}
  {% endfor %}
  {% endif %}

  STUDENT ARTIFACT
  This program compiles and passes every test case.
  {% for f in artifact_fields %}

  {{ f.label }}:
  {{ artifact[f.id] | default("", true) }}
  {% endfor %}

  CRITERIA TO JUDGE
  Return exactly one verdict for each of the following {{ criteria_to_judge | length }} criteria, using the id in brackets.
  {% for c in criteria_to_judge %}
  - [{{ c.id }}] {{ c.text }}
    {{ c.guidance | trim | indent(2) }}
  {% endfor %}
