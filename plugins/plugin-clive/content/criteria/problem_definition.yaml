# Criteria for phase.problem_definition.
#
# Edited through the CLive Studio app (`uv run clive-studio`) or by hand.
# `version` is what cases/suites/*.yaml pins as `criteria_version` -- bump it
# whenever a criterion's text or guidance changes, so a suite recorded against
# the old rubric is not silently re-interpreted against the new one.
#
#   gate  `gating` is the bare minimum this phase demands: a FAIL holds the student
#         here for another attempt. `advisory` is the deeper understanding the phase
#         is trying to build -- judged and reported exactly like any other criterion,
#         but a FAIL never blocks advancement. An omitted gate is read as `gating`.
#         Keep advisory criteria genuinely optional: anything the next phase cannot
#         be attempted without belongs in `gating`, not here.
#
#   fields  The artifact field ids a criterion is about. A stepped phase shows the
#           verdict on those questions and nowhere else. Must name real fields of
#           this phase. Keep it to one field per criterion where possible: a FAIL
#           turns every field it names red, so v6 split `concrete_types` into
#           `input_types` and `output_types` after a missing output type turned
#           Inputs red as well.
#
#   v7  `output_types` passes a formatted output (words, or values in a fixed pattern)
#       that is described, without a C type for its parts (2026-10-06, on Military Time
#       and Movie Runtime). A single printed value still needs one. The student-facing
#       lines and the guidance carry no example format: the nudge and hint read the
#       guidance, and an example such as a time would be one problem's answer.
#
#   v9  The student-facing lines of `input_order_stated` and `output_form_exact` no longer
#       assume the program reads and prints: a function's parameters come in an order, and
#       a returned value has no printed form (2026-10-26, walkthrough of Red Wildlings).
#
#   v10 (2026-11-17 criteria review; function problems that return a value only): new gating
#       `summary_is_correct`: the summary says what the function returns and the rule that decides
#       it (PCDIT's one-sentence statement checks understanding; Table 4.2 asks for a description
#       that is relevant and generally correct). `input_order_stated` dropped (the signature fixes
#       the parameter order) and `output_form_exact` dropped (a returned value has no printed form).
#       Wording revised throughout; 'Judge the inputs only' replaces 'Judge STRICTLY'.

id: criteria.problem_definition
phase: problem_definition
version: 10

criteria:
  - id: summary_is_correct
    text: The summary should correctly state what the program must work out from its inputs.
    gate: gating
    fields: [summary]
    not_met: "State in your summary what the program must work out, and the rule from the problem that decides it."
    explain: >-
      State generally what the program has to work out, and the rules from the problem
      description that decide the answer.
    guidance: |
      PASS if the summary states what the function must return and the main rule or rules from the problem that decide it.
      For a function problem, the function's parameters are its inputs and the return value is the output.
      Naming a familiar operation is enough when that operation is the rule (converting a time, finding an age, averaging values). Groups of operations can be described generally. The summary does not need the steps of a solution.
      Limits, special cases and the statement's clarifications may be left out, as these are handled in the later phases.
      FAIL if the summary is about something other than this task. FAIL also if it lacks what the function must return or what decides it, or states a rule that clearly contradicts the problem statement in a way that is fundamentally wrong for the question.
      Judge the MEANING only.
      For feedback writing: never state the problem's rule for the student, as they must come up with it themselves.

  - id: novel_wording
    text: The summary must be in the student's own words.
    gate: gating
    fields: [summary]
    not_met: "Restate the task in your own words instead of the problem's words/sentences."
    explain: >-
      Put the task in your own words instead of copying sentences from the problem.
    guidance: |
      PASS if the summary restates the task in the student's own phrasing.
      FAIL if it is largely copied spans from the problem statement, even when reordered.
      Note that certain nouns may have no natural synonym (variable names, 'average') and therefore do not count as copying.

  - id: input_types
    text: Each input has a C type.
    gate: gating
    fields: [inputs]
    not_met: "Provide a specific C input type: int, float, double or char."
    explain: >-
      Give each input a C type such as int, float, double or char. Don't provide vague
      examples such as "a number".
    guidance: |
      PASS plain words that name exactly one C type: 'integer' or 'whole number' (int), 'character' or 'letter' (char), 'decimal' or 'real number' (float or double), or if each input names a definite type a C programmer could declare -- 'int', 'float', 'double', 'char'.
      For a function problem, the function's parameters are its inputs and the value it returns is its output.
      FAIL for vague placeholders such as 'a number', 'some values', 'the data', or an input given with no type at all.
      Judge the inputs only. The type of the output is a separate criterion.

  - id: output_types
    text: State what kind of value the output is.
    gate: gating
    fields: [outputs]
    not_met: "Provide a specific C output type: int, float, double or char."
    explain: >-
      Provide the exact C type of the output such as int, float, double or char. Don't provide
      vague examples such as "a number".
    guidance: |
      PASS plain words that name exactly one C type: 'integer' or 'whole number' (int), 'character' or 'letter' (char), 'decimal' or 'real number' (float or double), or if each output names a definite type a C programmer could declare -- 'int', 'float', 'double', 'char'.
      For a function problem, the function's parameters are its inputs and the value it returns is its output.
      FAIL for vague placeholders such as 'a number', 'some values', 'the data', or an output given with no type at all.
      Judge the outputs only. The type of the input is a separate criterion.

  - id: constraints_noted
    text: The constraints on the inputs should be stated or it should state explicitly that there are none.
    gate: gating
    fields: [inputs]
    not_met: "Write down the constraints the problem puts on the inputs, or explicitly state that there are no constraints."
    explain: >-
      State what constraints the problem puts on the inputs, such as "always between 1 and
      100" or "never negative". If there are no explicit constraints, state that it provides
      none.
    guidance: |
      PASS if the artifact states at least one real constraint (such as value ranges, input size, sign, precision, ordering) OR explicitly says the problem states no constraints.
      FAIL if constraints are simply never mentioned. Note that the students should explicitly state that there are no constraints.
