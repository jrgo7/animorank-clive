# Criteria for phase.problem_definition.
#
# Edited through the CLive Studio app (`uv run clive-studio`) or by hand.
# `version` is what cases/suites/*.yaml pins as `criteria_version` -- bump it
# whenever a criterion's text or guidance changes, so a suite recorded against
# the old rubric is not silently re-interpreted against the new one.
#
#   gate  `gating` is the bare minimum this phase demands: a FAIL holds the student
#         here for another attempt. `advisory` is the deeper understanding the phase
#         is trying to build -- judged and reported exactly like any other criterion,
#         but a FAIL never blocks advancement. An omitted gate is read as `gating`.
#         Keep advisory criteria genuinely optional: anything the next phase cannot
#         be attempted without belongs in `gating`, not here.
#
#   fields  The artifact field ids a criterion is about. A stepped phase shows the
#           verdict on those questions and nowhere else. Must name real fields of
#           this phase. Keep it to one field per criterion where possible: a FAIL
#           turns every field it names red, so v6 split `concrete_types` into
#           `input_types` and `output_types` after a missing output type turned
#           Inputs red as well.
#
#   v7  `output_types` passes a formatted output (words, or values in a fixed pattern)
#       that is described, without a C type for its parts (2026-10-06, on Military Time
#       and Movie Runtime). A single printed value still needs one. The student-facing
#       lines and the guidance carry no example format: the nudge and hint read the
#       guidance, and an example such as a time would be one problem's answer.

id: criteria.problem_definition
phase: problem_definition
version: 8

criteria:
  - id: novel_wording
    text: The summary is in your own words.
    gate: gating
    fields: [summary]
    not_met: "You should retell the task in your own words instead of the problem's sentences."
    explain: >-
      Put the task in your own words instead of copying sentences from the problem.
    guidance: |
      PASS if the summary restates the task in the student's own phrasing.
      FAIL if it is largely copied spans from the problem statement, even when reordered.
      Domain nouns that have no natural synonym (variable names, 'average')
      do not count as copying.

  - id: input_types
    text: Each input has a C type.
    gate: gating
    fields: [inputs]
    not_met: "You should give each input a C type: int, float, double or char."
    explain: >-
      Give each input a C type -- int, float, double or char -- not just "a number". Does your input contain decimal places? Is it supposed to be a single letter?
    guidance: |
      PASS plain words that name exactly one C type: 'integer' or 'whole number' (int), 'character' or 'letter' (char), 'decimal' or 'real number' (float or double). FAIL only words that name no type.
      For a function problem, the function's parameters are its inputs and the value it returns is its output (a void function's output is what it prints); judge them the same way.
      PASS if each input names a definite type a C programmer could declare --
      'int', 'float', 'double', 'char'.
      FAIL for vague placeholders such as 'a number', 'some values', 'the data',
      or an input given with no type at all.
      Judge the inputs only. The type of the output is a separate criterion.

  - id: output_types
    text: You say what kind of value the output is.
    gate: gating
    fields: [outputs]
    not_met: "You should say what kind of value the output is, or describe exactly how the printed text looks."
    explain: >-
      If the program prints a single value, give its C type -- int, float, double or char.
      If it prints text or a pattern of several values, describe exactly how it looks instead.
    guidance: |
      PASS plain words that name exactly one C type: 'integer' or 'whole number' (int), 'character' or 'letter' (char), 'decimal' or 'real number' (float or double). FAIL only words that name no type.
      For a function problem, the function's parameters are its inputs and the value it returns is its output (a void function's output is what it prints); judge them the same way.
      PASS if each value the program prints on its own (a number or a single character)
      names a definite type a C programmer could declare -- 'int', 'float', 'double', 'char'.
      PASS if the output is formatted text -- words, or several values set inside a fixed
      pattern of symbols -- and the student describes its form. Do not require a C type for
      the parts, and accept 'text', 'words' or 'string' for printed words.
      FAIL for vague placeholders such as 'a number', 'the answer', 'the result', a single
      printed value with no type, or an output that is not described at all.
      These rules are seen by the feedback writers too: never answer a student with the
      problem's own output format; they must describe it themselves.
      How exact the description is belongs to output_form_exact, not here: a form that is
      recognisable but loose still passes this one.
      Judge the outputs only. The types of the inputs are a separate criterion.

  - id: constraints_noted
    text: The constraints on the inputs are stated, or you say there are none.
    gate: gating
    fields: [inputs]
    not_met: "You should write down every constraint the problem puts on the inputs, or say it gives none."
    explain: >-
      Say what constraints the problem puts on the inputs, like "always between 1 and 100" or
      "always never negative", or say plainly that it gives none.
    guidance: |
      PASS if the artifact states at least one real constraint (value ranges, input size,
      sign, precision, ordering) OR explicitly says the problem states no constraints.
      FAIL if constraints are simply never mentioned -- silence is not the same as
      declaring there are none.

  # ---- Advisory: extra understanding, never blocking -------------------------

  - id: input_order_stated
    text: You say which input the program reads first, and what comes after it.
    gate: advisory
    fields: [inputs]
    not_met: "You could also say which input the program reads first."
    explain: >-
      Say which input the program reads first and what comes after it -- for example,
      "first height, then weight". If it reads only one thing, say that.
    guidance: |
      For a function problem, the function's parameters are its inputs and the value it returns is its output (a void function's output is what it prints); judge them the same way.
      PASS if the artifact makes the reading order recoverable -- numbering the inputs,
      saying which is read first, or describing a count that is read before the values
      it governs.
      FAIL if the inputs are an unordered list and nothing indicates which arrives first.
      A student who has noticed that a leading count controls how much is read afterwards
      has understood the input shape, not just its types. Do not credit ordering that is
      merely implied by the order of the lines; the artifact has to say it.
      If the problem reads only one input (a single line, a single value), there is no
      order to state: PASS any artifact that identifies what that one input is.

  - id: output_form_exact
    text: You say exactly how the output looks when printed.
    gate: advisory
    fields: [outputs]
    not_met: "You could also say exactly how the output looks when printed."
    explain: >-
      Say exactly how the output looks -- decimal places, any words around it, spaces
      or commas between values -- wherever the problem fixes it.
    guidance: |
      PASS if the artifact fixes the printed form beyond naming a type -- decimal places,
      rounding, units, surrounding wording, separators, casing -- for every part of the
      output the problem statement constrains.
      FAIL if the output is given only as a type or a quantity ('the average', 'a float')
      where the statement fixes a format.
      If the statement genuinely fixes no format, PASS an artifact that says so, and do
      not require a student to invent one.
