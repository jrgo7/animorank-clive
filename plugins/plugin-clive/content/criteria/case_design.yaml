# Criteria for phase.case_design (the "C" of PCDIT).
#
# The student is working concrete examples BY HAND, before any algorithm exists.
# The point of this phase is that tracing a case yourself is what exposes the
# rule you are about to encode -- so these criteria reward shown work, not
# well-formatted input/output tables.
#
#   gate  `gating` is the bare minimum this phase demands: a FAIL holds the student
#         here for another attempt. `advisory` is the deeper understanding the phase
#         is trying to build -- judged and reported exactly like any other criterion,
#         but a FAIL never blocks advancement. An omitted gate is read as `gating`.
#         Keep advisory criteria genuinely optional: anything the next phase cannot
#         be attempted without belongs in `gating`, not here.
#
#   check `reference` means the criterion is computed, not judged: `outputs_are_correct`
#         runs each case row through the problem's `reference_solution` (see
#         src/clive/reference_check.py). Its guidance is only read when a problem has no
#         reference or it cannot run -- and then the judge rules on it as advisory.
#
#   fields  The step(s) a criterion is judged on. This phase is judged one case at a
#           time (`judge: per_step`): submitting a step judges only the criteria that
#           name it, against that case alone, so a criterion may name both steps. Since v7
#           the two steps are two equal cases and every criterion names both
#           (`edge_is_boundary` was removed).
#           v8: every criterion also names Cases 3-5 (`case_3`..`case_5`), which a student
#           adds on request; an added case is judged by exactly the same rules.
#           v10: student-facing lines say "print or return", for function problems
#           (2026-10-26, walkthrough of Red Wildlings).
#
#   v11 (2026-11-17 criteria review; function problems that return a value only): new advisory
#       `worked_out_differently` on Case 2 only, judged against the student's Case 1, which the
#       template shows as YOUR CASE 1. `output_format_matches_statement` dropped (a returned value
#       has no format). `work_is_shown` asks for the main steps with the case's own values; a
#       general method or a formula without them fails. Wording revised throughout.

id: criteria.case_design
phase: case_design
version: 11

criteria:
  - id: case_is_concrete
    text: The case has a real input and a real expected output.
    gate: gating
    fields: [normal_cases, edge_cases, case_3, case_4, case_5]
    not_met: "Provide a real input and the exact output the program would return."
    explain: >-
      Give actual input values that follow the constraints of the problem, and the output you
      expect -- not one of the examples you were given.
    guidance: |
      For a function problem, the function's parameters are its inputs and the value it returns is its output.
      A case's input is then the arguments the function is given, in any clear form ('612, 123456789' or 'checkSecretCode(612, 123456789)').
      PASS if the case's input and expected output are both literal values a program could actually be run against.
      FAIL if either is described only in the abstract ('a list of scores', 'the average'), if the expected output is missing, or if the case repeats an example from the problem statement or the PUBLIC TEST CASES.

  - id: work_is_shown
    text: The case must show the main steps, with its own values, that lead to the expected output.
    gate: gating
    fields: [normal_cases, edge_cases, case_3, case_4, case_5]
    not_met: "Show, step by step, how you got the expected output, using this case's values."
    explain: >-
      Under How I got it, show the main steps using this case's values: the arithmetic, the
      comparisons, and the values you keep track of. Don't just give the answer.
    guidance: |
      PASS if "How I got it" shows the intermediate work that produces the output, using this case's values, such as a running total, a comparison, a per-step trace, or an arithmetic expression with the case's values in it. The main steps are enough; every small step is not needed.
      FAIL if it only restates the answer, or gives the general method or a formula without this case's values in it.
      FAIL working that misquotes a rule of the problem or misrepresents the problem statement in general, even when the output is right.

  - id: outputs_are_correct
    text: The expected output is right for the input.
    gate: gating
    check: reference
    fields: [normal_cases, edge_cases, case_3, case_4, case_5]
    not_met: "Work out the expected output for this input again."
    explain: >-
      The expected output has to be the right value for the input. Work it out again against
      the problem's specifications.
    guidance: |
      Judge only the claimed value.
      Note that a correct value with wrong reasoning should pass as the reasoning is judged under work_is_shown.
      For a function problem, the function's parameters are its inputs and the value it returns is its output; judge them the same way.
      Compute the case yourself against the problem statement before judging. Judge the value the student is claiming, not how they wrote it down.
      PASS if the claimed value is the right one for its input.
      FAIL only if the claimed value is actually wrong or if the input is not part of the problem constraints. Quote the specific case as evidence.

  # ---- Advisory: extra understanding, never blocking -------------------------

  - id: worked_out_differently
    text: This case works out differently from your Case 1.
    gate: advisory
    fields: [edge_cases]
    not_met: "You could also pick a Case 2 that works out differently from your Case 1."
    explain: >-
      Choose values where something different happens than in Case 1. The answer should
      generally follow a different process or a different rule of the problem.
    guidance: |
      This criterion compares this case with the student's Case 1, shown under "YOUR CASE 1". Case 1 is context only; quote evidence from this case.
      For a function problem, the function's parameters are its inputs and the value it returns is its output.
      Decide it from the problem statement and the two inputs, by working each through the problem's rule yourself, not from the student's working.
      PASS if a different part of the problem's rule applies to this case compared to Case 1, such as a different condition holding. The two cases should generally work out differently from each other.
      FAIL if both cases go through the problem's rule the same way and differ only in their values. These cases typically have the same conditions holding.
      FAIL if this case's input is not allowed by the problem statement.
      These rules are seen by the feedback writers too: never tell the student which other path to take, and never suggest an input; they must find it themselves.
