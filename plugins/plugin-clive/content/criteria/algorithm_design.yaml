# Criteria for phase.algorithm_design (the "D" of PCDIT).
#
# The student is writing a plan a human could follow, not code. Criteria here
# guard against the two usual failure modes: skipping straight to C, and writing
# steps so vague that they restate the problem instead of solving it.
#
#   gate  `gating` is the bare minimum this phase demands: a FAIL holds the student
#         here for another attempt. `advisory` is the deeper understanding the phase
#         is trying to build -- judged and reported exactly like any other criterion,
#         but a FAIL never blocks advancement. An omitted gate is read as `gating`.
#         Keep advisory criteria genuinely optional: anything the next phase cannot
#         be attempted without belongs in `gating`, not here.
#
#   fields  Design is one outline field, `steps`; every criterion names it. v5 trimmed the
#           rubric for first-year students: `ordered_steps` went (the outline makes order
#           explicit) and `state_is_named` + `initialisation_is_explicit` merged into the
#           advisory `values_are_tracked`.
#
#   v8  `inputs_are_consumed` reads as well for a function's parameters; a step that repeats
#       earlier steps on other named values is traceable; a value set once needs no starting
#       value (2026-10-26, walkthrough of Red Wildlings).
#
#   v9 (2026-11-17 criteria review; function problems that return a value only):
#       `inputs_are_consumed` dropped (a function's parameters are given, and a plan that ignores
#       one rarely traces to the right output). `traceable_on_own_case` traces the case 'generally
#       as written', a lenient reading the team chose until prototype testing. `not_c_code` passes
#       pseudocode; `output_is_produced` checks only that a step returns the answer. Wording revised.
#
#   v10 (2026-11-24, after the single-fault run of 2026-11-22): `output_is_produced` needs a step
#       that returns the value; a conclusion ("the ID is valid") is not enough.
#       `traceable_on_own_case` (revisiting decision I1): a step that only restates its goal cannot
#       be carried out as written, even when variable names or earlier phases hint at the rule.
#
#   v11 (2026-11-25, team review of the real-data comparison): `values_are_tracked` fails a value
#       that one step works out and a later step uses only vaguely ("their sums", "the result"),
#       including a value worked out once; such a value still needs no starting value, but it
#       needs a name (real data R101).

id: criteria.algorithm_design
phase: algorithm_design
version: 11

criteria:
  - id: not_c_code
    text: The steps are written in plain words, not C.
    gate: gating
    fields: [steps]
    not_met: "Rewrite any step that uses C in plain words."
    explain: >-
      Describe each step in plain words. The C code will be written in the next phase.
    guidance: |
      PASS if the steps are in plain words or pseudocode that a reader who does not know C could follow.
      FAIL if the artifact is C source code, such as semicolon-terminated statements, or if it includes statements like "for (i = 0; i < n; i++)", "printf" or "scanf" calls, type declarations, or braces used as blocks. Variables and arithmetic expressions such as 'total / n' are allowed.

  - id: output_is_produced
    text: A step returns the answer.
    gate: gating
    fields: [steps]
    not_met: "Add a step that provides the answer."
    explain: >-
      Include a step that returns the answer based on the problem description.
    guidance: |
      PASS if some step states the value the function returns.
      FAIL if the plan computes an answer but never states that it is the output, or outputs something in a shape the statement does not ask for. A step must say the value is returned as the function's result. Reaching a conclusion without explicitly returning it should fail.

  - id: traceable_on_own_case
    text: Steps can be carried out by hand on your own case.
    gate: gating
    fields: [steps]
    not_met: "Make each step something you could do by hand, then try following your Case 1 through your design."
    explain: >-
      Take your Case 1 and follow it through your steps, one at a time. Each step should be
      something you could concretely do with the values and should lead to the output.
    guidance: |
      Take the student's typical case from EARLIER PHASES (the Cases phase: its input and expected output) and trace it through the steps generally as written.
      FAIL if a step cannot be carried out as written and does not reach the case's expected output.
      PASS if every step can be done by hand on that case and the trace can be followed to the expected output.
      Judge whether the plan can be followed, not whether it is the best plan or follows a particular solution. Steps that only restate what they should achieve (e.g. update the counts, if it works, add the points) cannot be carried out as written, even if variable names, phrases or earlier phases hint at it.

  # ---- Advisory: extra understanding, never blocking -------------------------

  - id: values_are_tracked
    text: The values the steps keep track of must be named and given starting values.
    gate: advisory
    fields: [steps]
    not_met: "You could also name each value your steps keep track of and give it a starting value."
    explain: >-
      Name each value the plan keeps track of, such as a running total or a counter, and give
      it a starting value before any step changes it. A value worked out once and never
      changed needs no starting value, but give it a name so later steps can refer to it.
    guidance: |
      PASS if every value carried across steps, such as a total, a running counter or a flag, is defined and given a starting value before any step updates it. PASS a plan that carries no value across steps. A value worked out once and never updated needs no starting value, but it still needs a name.
      FAIL if a step updates or uses a value ('add it to the total') that no earlier step introduced or started.
      FAIL if a step uses a value an earlier step worked out but refers to it only vaguely ("their sums", "it", "the result", "to a value") instead of by a name. Values that are used in one computation or step count as values that should be tracked and specifically named by the plan.

  - id: covers_own_edge_cases
    text: The steps handle each case you worked out in Cases.
    gate: advisory
    fields: [steps]
    not_met: "Try simulating each of your cases through your plan."
    explain: >-
      Simulate each case you worked out in Cases through your steps. The plan should give the
      output you worked out for it.
    guidance: |
      If an EARLIER PHASES section gives this student's cases from Cases, trace each one through the steps. PASS if the plan would produce the right output for it, by a step that treats it specially or by a general step that plainly covers it.
      FAIL if it would fall through the steps, repeat the wrong number of times, or reach a step that does not apply to it; quote that step as evidence (do not quote the earlier phase).
      PASS if no earlier case is given.

  - id: termination_is_clear
    text: Every repeat states what ends it.
    gate: advisory
    fields: [steps]
    not_met: "State termination conditions for each iteration statement."
    explain: >-
      For every iteration statement, state a termination condition.
    guidance: |
      PASS if each repeated step states its bound: a count read from input, the length of a collection, or a condition that the steps themselves make false.
      FAIL if a step repeats 'until done' or 'for each' with nothing establishing what done means or what is being walked.
      PASS if the design does not indicate any repetition statement at all.
